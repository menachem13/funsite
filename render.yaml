# Database is external (Supabase — see README's Deployment section for why
# and how to set it up), so it isn't provisioned here. DATABASE_URL is filled
# in by hand in the Render dashboard after you create the Supabase project.
services:
  - type: web
    name: funall-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      # Admin login (fixed username + emailed OTP — see backend/README.md).
      # Without SMTP_* vars set too, the OTP only logs to Render's own
      # service logs rather than actually emailing — fine to start with,
      # since that log is private to your Render account, but set SMTP_HOST
      # etc. before treating this as real access control.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_OTP_EMAILS
        sync: false
      # Listing photo/video storage (Supabase Storage — see backend/README.md's
      # "Listing photo/video storage" section for the one-time bucket setup).
      # Required in production: without these the server refuses to boot,
      # rather than silently falling back to Render's local disk, which is
      # wiped on every redeploy.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: listing-media
