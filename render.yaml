# NOTE: plan: free databases on Render are deleted after 30 days (data and
# all). Fine for a first test deploy; switch to a paid plan before you have
# real signups you can't afford to lose (see README's Deployment section).
databases:
  - name: funsite-db
    databaseName: funsite
    user: funsite
    plan: free

services:
  - type: web
    name: funsite-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: funsite-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
